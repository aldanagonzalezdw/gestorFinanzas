<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestor de Finanzas Personales</title>
  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Chart.js  -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body class="bg-indigo-50 min-h-screen text-slate-700 p-4 md:p-8 font-sans">
  <div class="max-w-5xl mx-auto space-y-6">

    <!-- Titulo -->
    <header class="text-center space-y-1">
      <h1 class="text-3xl font-bold text-slate-800">
        Gestor de Finanzas Personales
      </h1>
      <p class="text-sm text-slate-500">
        Lleva el control de tus ingresos y gastos de forma súper fácil
      </p>
    </header>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <!-- Formulario -->
      <section
        class="bg-white p-6 rounded-2xl shadow-md border border-slate-100 md:col-span-1 h-fit transition duration-300 hover:shadow-lg hover:-translate-y-0.5">
        <h2 class="text-base font-bold mb-4 text-slate-800 flex items-center gap-2">
          <span></span> Nuevo Movimiento
        </h2>

        <form id="form-transaccion" class="space-y-4">
          <!-- Mensaje de error -->
          <p id="error" class="text-xs text-rose-500 font-bold hidden"></p>

          <!-- Descripción -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Descripción</label>
            <input type="text" id="descripcion" required
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-200"
              placeholder="Ej. Salida con amigos" />
          </div>

          <!-- Monto -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Monto ($)</label>
            <input type="number" id="monto" step="0.01" required
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-200"
              placeholder="0.00" />
          </div>

          <!-- Fecha -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Fecha</label>
            <input type="date" id="fecha" required
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-200" />
          </div>

          <!-- Tipo -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Tipo</label>
            <select id="tipo"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-200">
              <option value="ingreso">Ingreso</option>
              <option value="gasto">Gasto</option>
            </select>
          </div>

          <!-- Categoría -->
          <div>
            <label class="block text-xs font-bold text-slate-600 mb-1">Categoría</label>
            <select id="categoria"
              class="w-full px-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:bg-white transition duration-200">
              <!-- Opciones -->
            </select>
          </div>

          <!-- Agregar -->
          <button type="submit"
            class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl text-sm shadow-md shadow-indigo-200 transition transform active:scale-95 duration-150">
            Agregar Movimiento
          </button>

          <!-- Eliminar -->
          <button type="button" id="btn-eliminar-ultimo"
            class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-sm shadow-md transition transform active:scale-95 duration-150">
            Eliminar Último Movimiento
          </button>
        </form>
      </section>

      <!-- Gráficos -->
      <div class="md:col-span-2 space-y-6">
        <section
          class="bg-white p-6 rounded-2xl shadow-md border border-slate-100 space-y-8 transition duration-300 hover:shadow-lg">
          <!-- Gráfico Categoría -->
          <div>
            <h2 class="text-base font-bold mb-4 text-slate-800 flex items-center gap-2">
              Resumen por Categorías
            </h2>
            <div class="relative h-64">
              <canvas id="graficoCategorias"></canvas>
            </div>
          </div>

          <!-- Gráfico Líneas Temporal -->
          <div>
            <h2 class="text-base font-bold mb-4 text-slate-800 flex items-center gap-2">
              Evolución Temporal (Ingresos, Egresos y Balance)
            </h2>
            <div class="relative h-64">
              <canvas id="graficoEvolucion"></canvas>
            </div>
          </div>
        </section>
      </div>

    </div>
  </div>
  <script type="module" src="./app.js"></script>
</body>

</html>
